paths:
  data_dir: data
  models_dir: models
  uploads_dir: uploads
  outputs_dir: outputs
  reports_dir: reports

pose_estimation:
  backend: mediapipe
  confidence_threshold: 0.5

club_localization:
  # Crops toward the golfer's arms/hands (using yolov8n-pose.pt, already
  # bundled with the project) before the five-way classifier runs below.
  # That classifier is trained on isolated club-head photos, not full
  # "person holding a club" frames -- cropping first keeps live-capture
  # photos closer to that training distribution. This is a heuristic ROI
  # based on pose keypoints, not a trained club detector; see
  # swingsight.club_localization for details and known failure modes.
  enabled: true
  pose_model_path: yolov8n-pose.pt
  min_keypoint_confidence: 0.3
  padding_fraction: 0.45
  min_padding_scale: 0.6

club_recognition:
  confirm_threshold: 0.6
  # Preferred live-capture classifier. The checkpoint stores the five class
  # labels: driver, wood, hybrid, iron, and wedge.
  five_way_cnn_model_path: models/trained/club_type_5way.pt
  five_way_cnn_min_confidence: 0.60
  # Stage 2 runs only after five-way detection returns Iron or Wedge. RapidOCR
  # uses pretrained PP-OCR small models through ONNX Runtime; no club-marking
  # training images or custom checkpoint are required.
  marking_ocr:
    backend: rapidocr
    min_confidence: 0.70
    max_image_side: 1600
    # Upscale small crops before OCR so a small marking still has enough
    # pixel height for RapidOCR's text detector to find it.
    min_image_side: 900
    enhance_contrast: true
    contrast_clip_limit: 2.0
    sharpen: false
    # RapidOCR handles normal text orientation itself. These two extra passes
    # run only after the original full image has no valid marking.
    try_sideways_rotations_on_failure: true
  # Legacy fallback for an Iron-only numbers checkpoint.
  # Stage 1: class_names must be iron and wood (or one of the documented aliases).
  broad_cnn_model_path: models/trained/club_broad_cnn.pt
  broad_cnn_min_confidence: 0.55
  # Retained only for older installations; exact Iron and Wedge markings now
  # use full-image pretrained OCR instead of this custom number checkpoint.
  iron_number_cnn_model_path: models/trained/club_iron_number_cnn.pt
  iron_number_cnn_min_confidence: 0.55
  # Stage 3 for a wood: class_names driver, wood, and hybrid.
  wood_type_cnn_model_path: models/trained/club_wood_type_cnn.pt
  wood_type_cnn_min_confidence: 0.55

metrics:
  smoothing_window: 5
  normalize_by: torso

# Gemini receives only local CV measurements by default—not the video, frames,
# file paths, or debug artifacts. Export GEMINI_API_KEY in the runtime environment.
gemini:
  enabled: true
  api_key_env: GEMINI_API_KEY
  # Gemini 3 Flash currently uses a pinned preview identifier.
  model: gemini-3-flash-preview
  timeout_seconds: 35
  # Includes room for Gemini 3 reasoning plus the full structured coaching result.
  max_output_tokens: 4096

preprocessing:
  adaptive_contrast: true
  adaptive_contrast_clip_limit: 2.0
  adaptive_contrast_tile_grid_size: [8, 8]

feedback:
  driver_wood:
    spine_angle_range: [30, 45]
    head_movement_max_cm: 5
  hybrid:
    spine_angle_range: [25, 40]
    head_movement_max_cm: 4
  iron_wedge:
    spine_angle_range: [20, 35]
    head_movement_max_cm: 3

app:
  max_video_seconds: 12
  key_frame_stride: 3
  local_web_host: 127.0.0.1
  local_web_port: 8000
